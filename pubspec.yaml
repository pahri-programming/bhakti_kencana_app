name: bhakti_kencana_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  get: ^4.6.6

  # HTTP request
  http: ^1.1.0

  # Simpan token di local storage
  shared_preferences: ^2.2.3

  # Upload file/image
  image_picker: ^1.0.7

  # Format tanggal
  intl: ^0.18.1

  # Icon
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/